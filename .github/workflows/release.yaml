name: Release Gazeta
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Require a tested main commit
        run: git merge-base --is-ancestor HEAD origin/main
      - run: ./scripts/check.sh
      - name: Publish Go module release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
